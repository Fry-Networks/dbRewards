services:
  dbrewards:
    dns:
      - 100.100.100.100
      - 1.1.1.1
    build: .
    container_name: dbrewards-prod
    restart: unless-stopped
    network_mode: "host" # Use host network so tailnet access comes from the host (no sidecar needed).
    environment:
      # 1Password secrets injection
      MONGO_URI: op://dbRewards/MONGO_SELF_URI/mongo_uri
      CREDS_MONGO_URI: op://dbRewards/CREDS_SELF_MONGO_URI/password
      DISCORD_WEBHOOK_URL: op://dbRewards/DISCORD_WEBHOOK_URL/password
      # Static configuration
      CREDS_HARDWARE_COLLECTION: "hardware"
      CREDS_DB_NAME: "creds"
      VALIDATE_HARDWARE_AEM: "false"
      VALIDATE_HARDWARE_NODES: "false"
      VALIDATE_HARDWARE_MINERS: "false"
      VALIDATE_CREDENTIALS_RADIATION: "false"
      VALIDATE_CREDENTIALS_ENERGY: "false"
      VALIDATE_CREDENTIALS_AIR: "false"
      VALIDATE_CREDENTIALS_WATER: "false"
      VALIDATE_CREDENTIALS_WEATHER: "false"
      NODE_ENV: "production"
      NODE_OPTIONS: "--max-old-space-size=8192"
      WEEKLY_REWARDS_ENABLED: "true"
      INLINE_WEEKLY_JOBS: "false"
      POC_REWARD_INSTALLER: "true"     # 5 gates: data+online+mac_match+pol+poi (AEM, BM, IDM, ODM, ISM, OSM, IRM, EM, HWM, LWM, RDN, SDN, SVN, CN)
      POC_REWARD_NON_INSTALLER: "true" # 4 gates: data+online+pol+poi (cameras, weather, AQ monitors — no MAC)
      POC_DB_NAME: "PoC"
      POC_HARDWARE_COLLECTION: "hardware"
      NEXT_PUBLIC_WEEKLY_REWARDS_ENABLED: "true"
      WEEKLY_CUTOFF_UTC: "2025-09-12T00:00:00.00Z"
      SIMULATION_ENABLED: "false" # DO NOT TOUCH - Simulation mode is controlled by the separate dbrewards-sim service, and enabling it here would cause unintended consequences.
      TEST_MODE: "false"
      DEBUG: "false"
      ALERTS_ENABLED: "true"
      DASHBOARD_PORT: 30033
      ALERT_MAX_FAILURE_RATE: 20
      ALERT_MAX_PROCESSING_TIME: 45
      ALERT_MAX_SLOW_QUERY_RATE: 15
      ALERT_MAX_ERROR_RATE: 5
      MATURATION_ENABLED: "true"
      WEEKLY_MATURATION_ENABLED: "false"
      RUN_DAILY_MATURATION_ONCE: "false"
      DAILY_MATURATION_ONCE_TIMEBASE: "real"
      ADMIN_ALLOWED_IPS:
      ADMIN_ENDPOINTS_ENABLED: "false"
      REWARD_REPORT_DIR: /home/fryadmin/projects/dbRewards/reward-reports
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - /etc/ssl/mongo/ca/certs/mongo-ca.crt:/etc/ssl/mongo/mongo-ca.crt:ro # Mount MongoDB CA cert for TLS validation.
      - /home/fryadmin/projects/dbRewards/reward-reports:/home/fryadmin/projects/dbRewards/reward-reports
    secrets:
      - op_service_account_token
    # ports omitted because host networking publishes container ports directly on the host.
    #networks:
    #  - dbrewards-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node dist/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Simulation/test mode service (disabled by default)
  dbrewards-sim:
    build: .
    container_name: dbrewards-sim
    restart: "no"
    profiles:
      - simulation
    network_mode: "host" # Use host network so tailnet access comes from the host (no sidecar needed).
    environment:
      # 1Password secrets injection
      MONGO_URI: op://dbRewards/MONGO_SELF_URI/mongo_uri
      #use /dbRewards/VER_MONGO_URI/password for testing DB Project
      CREDS_MONGO_URI: op://dbRewards/CREDS_SELF_MONGO_URI/password
      DISCORD_WEBHOOK_URL: op://dbRewards/DISCORD_WEBHOOK_URL/password
      # Simulation mode configuration
      CREDS_HARDWARE_COLLECTION: "hardware"
      CREDS_DB_NAME: "creds"
      VALIDATE_HARDWARE_AEM: "false"
      VALIDATE_HARDWARE_NODES: "false"
      VALIDATE_HARDWARE_MINERS: "false"
      VALIDATE_CREDENTIALS_RADIATION: "false"
      VALIDATE_CREDENTIALS_ENERGY: "false"
      VALIDATE_CREDENTIALS_AIR: "false"
      VALIDATE_CREDENTIALS_WATER: "false"
      VALIDATE_CREDENTIALS_WEATHER: "false"
      WEEKLY_CUTOFF_UTC: "2025-09-12T00:00:00.00Z"      
      NODE_ENV: development
      WEEKLY_REWARDS_ENABLED: "true"
      INLINE_WEEKLY_JOBS: "false"
      NEXT_PUBLIC_WEEKLY_REWARDS_ENABLED: "true"
      POC_REWARD_INSTALLER: "true"     # 5 gates: data+online+mac_match+pol+poi
      POC_REWARD_NON_INSTALLER: "true" # 4 gates: data+online+pol+poi (no MAC)
      SIMULATION_ENABLED: "true"
      TEST_MODE: "false"
      DEBUG: "false"
      TIME_ACCEL: 12
      SIM_START_AT: "2026-02-20T10:00:00Z"
      ALERTS_ENABLED: "false"
      DASHBOARD_PORT: 30032
      MATURATION_ENABLED: "true"
      RUN_DAILY_MATURATION_ONCE: "false"
      DAILY_MATURATION_ONCE_TIMEBASE: "real"
      DAILY_MATURATION_ENABLED: "false"
      WEEKLY_MATURATION_ENABLED: "false"
      REWARD_REPORT_DIR: /home/fryadmin/projects/dbRewards/reward-reports
    volumes:
      - /home/fryadmin/projects/dbRewards/logs:/app/logs
      - /etc/ssl/mongo/ca/certs/mongo-ca.crt:/etc/ssl/mongo/mongo-ca.crt:ro # Mount MongoDB CA cert for TLS validation.
      - /home/fryadmin/projects/dbRewards/reward-reports:/home/fryadmin/projects/dbRewards/reward-reports
    secrets:
      - op_service_account_token
    # ports omitted because host networking publishes container ports directly on the host.
#    networks:
#      - dbrewards-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  dbrewards-weekly:
    dns:
      - 100.100.100.100
      - 1.1.1.1
    build: .
    container_name: dbrewards-weekly
    restart: unless-stopped
    network_mode: "host" # Use host network so tailnet access comes from the host (no sidecar needed).
    command: ["node", "dist/scripts/run-weekly-jobs.js"]
    #profiles:
     # - simulation
    environment:
      MONGO_URI: op://dbRewards/MONGO_SELF_URI/mongo_uri
      CREDS_MONGO_URI: op://dbRewards/CREDS_SELF_MONGO_URI/password
      DISCORD_WEBHOOK_URL: op://dbRewards/DISCORD_WEBHOOK_URL/password
      CREDS_HARDWARE_COLLECTION: "hardware"
      CREDS_DB_NAME: "creds"
      VALIDATE_HARDWARE_AEM: "false"
      VALIDATE_HARDWARE_NODES: "false"
      VALIDATE_HARDWARE_MINERS: "false"
      VALIDATE_CREDENTIALS_RADIATION: "false"
      VALIDATE_CREDENTIALS_ENERGY: "false"
      VALIDATE_CREDENTIALS_AIR: "false"
      VALIDATE_CREDENTIALS_WATER: "false"
      VALIDATE_CREDENTIALS_WEATHER: "false"
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=4096"
      WEEKLY_REWARDS_ENABLED: "true"
      NEXT_PUBLIC_WEEKLY_REWARDS_ENABLED: "true"
      POC_REWARD_INSTALLER: "true"     # 5 gates: data+online+mac_match+pol+poi (AEM, BM, IDM, ODM, ISM, OSM, IRM, EM, HWM, LWM, RDN, SDN, SVN, CN)
      POC_REWARD_NON_INSTALLER: "true" # 4 gates: data+online+pol+poi (cameras, weather, AQ monitors — no MAC)
      POC_DB_NAME: "PoC"
      POC_HARDWARE_COLLECTION: "hardware"
      SIMULATION_ENABLED: "false"
      TIME_ACCEL: 1
      SIM_START_AT: "2026-02-20T10:00:00Z"
      TEST_MODE: "false"
      DEBUG: "false"
      ALERTS_ENABLED: "false"
      MATURATION_ENABLED: "true"
      DAILY_MATURATION_ENABLED: "false"
      WEEKLY_MATURATION_ENABLED: "true"
      RUN_DAILY_MATURATION_ONCE: "false"
      DAILY_MATURATION_ONCE_TIMEBASE: "real"
      REWARD_REPORT_DIR: /home/fryadmin/projects/dbRewards/reward-reports
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - /etc/ssl/mongo/ca/certs/mongo-ca.crt:/etc/ssl/mongo/mongo-ca.crt:ro # Mount MongoDB CA cert for TLS validation.
      - /home/fryadmin/projects/dbRewards/reward-reports:/home/fryadmin/projects/dbRewards/reward-reports
    secrets:
      - op_service_account_token
    # ports omitted because host networking publishes container ports directly on the host.
#    networks:
#      - dbrewards-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
# No custom networks needed; host networking is used for tailnet reachability.
#networks:
#  dbrewards-network:
#    driver: bridge

  wix-sync:
    dns:
      - 100.100.100.100
      - 1.1.1.1
    build: .
    container_name: wix-sync
    restart: unless-stopped
    network_mode: "host"
    command: ["node", "dist/scripts/wix-sync.js"]
    environment:
      MONGO_URI: "op://dbRewards/MONGO_SELF_URI/mongo_uri"
      WIX_API_KEY: "op://dbRewards/Wix API/api_key"
      WIX_SITE_ID: "op://dbRewards/Wix API/site_id"
      WIX_ACCOUNT_ID: "op://dbRewards/Wix API/account_id"
      SYNC_INTERVAL_MS: "900000"
      HEALTH_PORT: "8085"
      NODE_ENV: "production"
    volumes:
      - /etc/ssl/mongo/ca/certs/mongo-ca.crt:/etc/ssl/mongo/mongo-ca.crt:ro
    secrets:
      - op_service_account_token
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

secrets:
  op_service_account_token:
    file: /etc/opt/dbrewards/op_service_account_token
