services:
  dbrewards:
    build: .
    container_name: dbrewards-prod
    restart: unless-stopped
    environment:
      # 1Password secrets injection
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN?missing_OP_SERVICE_ACCOUNT_TOKEN}
      MONGO_URI: op://dbRewards/MONGO_URI/password
      CREDS_MONGO_URI: op://dbRewards/CREDS_MONGO_URI/password
      DISCORD_WEBHOOK_URL: op://dbRewards/DISCORD_WEBHOOK_URL/password
      # Static configuration
      CREDS_HARDWARE_COLLECTION: "hardware"
      CREDS_DB_NAME: "creds"
      VALIDATE_HARDWARE_AEM: "false"
      VALIDATE_HARDWARE_NODES: "false"
      VALIDATE_HARDWARE_MINERS: "false"
      VALIDATE_CREDENTIALS_RADIATION: "false"
      VALIDATE_CREDENTIALS_ENERGY: "false"
      VALIDATE_CREDENTIALS_AIR: "false"
      VALIDATE_CREDENTIALS_WATER: "false"
      VALIDATE_CREDENTIALS_WEATHER: "false"
      NODE_ENV: "production"
      NODE_OPTIONS: "--max-old-space-size=8192"
      WEEKLY_REWARDS_ENABLED: "true"
      INLINE_WEEKLY_JOBS: "false"
      NEXT_PUBLIC_WEEKLY_REWARDS_ENABLED: "true"
      WEEKLY_CUTOFF_UTC: "2025-09-12T00:00:00.00Z"
      SIMULATION_ENABLED: "false"
      TEST_MODE: "false"
      DEBUG: "false"
      ALERTS_ENABLED: "true"
      DASHBOARD_PORT: 30033
      ALERT_MAX_FAILURE_RATE: 20
      ALERT_MAX_PROCESSING_TIME: 45
      ALERT_MAX_SLOW_QUERY_RATE: 15
      ALERT_MAX_ERROR_RATE: 5
      MATURATION_ENABLED: "true"
      WEEKLY_MATURATION_ENABLED: "false"
      RUN_DAILY_MATURATION_ONCE: "false"
      DAILY_MATURATION_ONCE_TIMEBASE: "real"
      ADMIN_ALLOWED_IPS:
      ADMIN_ENDPOINTS_ENABLED: "false"
      REWARD_REPORT_DIR: /home/debfrynetadm/projects/dbRewards/reward-reports
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/debfrynetadm/projects/dbRewards/reward-reports:/home/debfrynetadm/projects/dbRewards/reward-reports
    ports:
      - "30033:30033"  # Web dashboard
    networks:
      - dbrewards-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:30033/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Simulation/test mode service (disabled by default)
  dbrewards-sim:
    build: .
    container_name: dbrewards-sim
    restart: "no"
    profiles:
      - simulation
    environment:
      # 1Password secrets injection
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN?missing_OP_SERVICE_ACCOUNT_TOKEN}
      MONGO_URI: op://dbRewards/MONGO_URI/password
      #use /dbRewards/VER_MONGO_URI/password for testing DB Project
      CREDS_MONGO_URI: op://dbRewards/CREDS_MONGO_URI/password
      DISCORD_WEBHOOK_URL: op://dbRewards/DISCORD_WEBHOOK_URL/password
      # Simulation mode configuration
      CREDS_HARDWARE_COLLECTION: "hardware"
      CREDS_DB_NAME: "creds"
      VALIDATE_HARDWARE_AEM: "false"
      VALIDATE_HARDWARE_NODES: "false"
      VALIDATE_HARDWARE_MINERS: "false"
      VALIDATE_CREDENTIALS_RADIATION: "false"
      VALIDATE_CREDENTIALS_ENERGY: "false"
      VALIDATE_CREDENTIALS_AIR: "false"
      VALIDATE_CREDENTIALS_WATER: "false"
      VALIDATE_CREDENTIALS_WEATHER: "false"
      WEEKLY_CUTOFF_UTC: "2025-09-12T00:00:00.00Z"      
      NODE_ENV: development
      WEEKLY_REWARDS_ENABLED: "true"
      INLINE_WEEKLY_JOBS: "false"
      NEXT_PUBLIC_WEEKLY_REWARDS_ENABLED: "true"
      SIMULATION_ENABLED: "true"
      TEST_MODE: "false"
      DEBUG: "false"
      TIME_ACCEL: 32
      SIM_START_AT: "2025-11-11T00:00:00Z"
      ALERTS_ENABLED: "false"
      DASHBOARD_PORT: 30032
      MATURATION_ENABLED: "true"
      RUN_DAILY_MATURATION_ONCE: "false"
      DAILY_MATURATION_ONCE_TIMEBASE: "real"
      DAILY_MATURATION_ENABLED: "false"
      WEEKLY_MATURATION_ENABLED: "false"
      REWARD_REPORT_DIR: /home/debfrynetadm/projects/dbRewards/reward-reports
    volumes:
      - /home/debfrynetadm/projects/dbRewards/logs:/app/logs
      - /home/debfrynetadm/projects/dbRewards/reward-reports:/home/debfrynetadm/projects/dbRewards/reward-reports
    ports:
      - "30032:30032"  # Web dashboard for simulation
    networks:
      - dbrewards-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  dbrewards-weekly:
    build: .
    container_name: dbrewards-weekly
    restart: "no"
    command: ["dumb-init", "op", "run", "--", "node", "dist/scripts/run-weekly-jobs.js"]
    profiles:
      - simulation
    environment:
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN?missing_OP_SERVICE_ACCOUNT_TOKEN}
      MONGO_URI: op://dbRewards/MONGO_URI/password
      CREDS_MONGO_URI: op://dbRewards/CREDS_MONGO_URI/password
      DISCORD_WEBHOOK_URL: op://dbRewards/DISCORD_WEBHOOK_URL/password
      CREDS_HARDWARE_COLLECTION: "hardware"
      CREDS_DB_NAME: "creds"
      VALIDATE_HARDWARE_AEM: "false"
      VALIDATE_HARDWARE_NODES: "false"
      VALIDATE_HARDWARE_MINERS: "false"
      VALIDATE_CREDENTIALS_RADIATION: "false"
      VALIDATE_CREDENTIALS_ENERGY: "false"
      VALIDATE_CREDENTIALS_AIR: "false"
      VALIDATE_CREDENTIALS_WATER: "false"
      VALIDATE_CREDENTIALS_WEATHER: "false"
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=4096"
      WEEKLY_REWARDS_ENABLED: "true"
      NEXT_PUBLIC_WEEKLY_REWARDS_ENABLED: "true"
      SIMULATION_ENABLED: "false"
      TIME_ACCEL: 4
      SIM_START_AT: "2025-11-09T04:00:00Z"
      TEST_MODE: "false"
      DEBUG: "false"
      ALERTS_ENABLED: "false"
      MATURATION_ENABLED: "true"
      DAILY_MATURATION_ENABLED: "false"
      WEEKLY_MATURATION_ENABLED: "true"
      RUN_DAILY_MATURATION_ONCE: "false"
      DAILY_MATURATION_ONCE_TIMEBASE: "real"
      REWARD_REPORT_DIR: /home/debfrynetadm/projects/dbRewards/reward-reports
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/debfrynetadm/projects/dbRewards/reward-reports:/home/debfrynetadm/projects/dbRewards/reward-reports
    networks:
      - dbrewards-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  dbrewards-network:
    driver: bridge
